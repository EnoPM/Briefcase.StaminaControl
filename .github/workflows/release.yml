name: Publish mod release
run-name: Mod release from VERSION - Windows and Linux
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mod-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Validate source
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/publish.py --source-only --version $version --commit $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Invalid release source' }
      - name: Fetch SDK, build and test
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-mod
          path: |
            dist/*-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 7
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.16.0
      - name: Validate source and install compiler
        run: |
          version=$(cat VERSION)
          python3 scripts/publish.py --source-only --version "$version" --commit "$GITHUB_SHA"
          sudo apt-get update
          sudo apt-get install --no-install-recommends clang-19 cmake ninja-build
      - name: Fetch SDK, build and test
        run: |
          sdk=$(python3 scripts/fetch-sdk.py)
          python3 scripts/build-linux.py --sdk "$sdk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-mod
          path: |
            dist/*-linux-x64-*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-mod'
          merge-multiple: true
          path: dist
      - name: Test publication contracts
        run: python3 tests/Publication.py
      - name: Publish both verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=()
          if [[ "$DRAFT" == true ]]; then args+=(--draft); fi
          version=$(cat VERSION)
          python3 scripts/publish.py --version "$version" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" "${args[@]}"
